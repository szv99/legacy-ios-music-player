services:
  player7:
    build: .
    container_name: player7-server
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Optional. When set, enter the same token in the app's Settings.
      PLAYER7_TOKEN: ""
      # Optional. Spotify artists and search need these (https://developer.spotify.com/dashboard).
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_CLIENT_SECRET: ""
      SPOTIFY_MARKET: "US"
      # Optional. Route yt-dlp through a proxy if YouTube blocks your server's IP.
      YOUTUBE_PROXY: ""
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./secrets:/app/secrets
